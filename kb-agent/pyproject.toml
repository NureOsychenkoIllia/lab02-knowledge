[project]
name = "kb-agent"
version = "1.0.0"
description = "Агент з базою знань Obsidian і векторним індексом Chroma (ЛР 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.0",
    "google-genai>=3.3.0",
    "python-dotenv>=1.2.4",
    "python-frontmatter>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
